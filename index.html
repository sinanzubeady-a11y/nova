<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOVA - المحادثة الشاملة</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        html, body { height: 100vh; width: 100vw; background-color: #0b0f19; color: #f3f4f6; overflow: hidden; }
        .auth-container { display: flex; justify-content: center; align-items: center; height: 100vh; width: 100vw; background: radial-gradient(circle at center, #1e293b 0%, #0b0f19 100%); }
        .auth-card { background: #0f172a; padding: 40px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); width: 100%; max-width: 400px; text-align: center; border: 1px solid #1e293b; }
        .auth-card i { font-size: 50px; color: #3b82f6; margin-bottom: 20px; }
        .auth-card h1 { font-size: 28px; letter-spacing: 1px; margin-bottom: 10px; color: #ffffff; }
        .auth-card p { color: #94a3b8; font-size: 13px; margin-bottom: 20px; }
        .auth-card input { width: 100%; padding: 12px 15px; margin-bottom: 15px; background: #1e293b; border: 1px solid #334155; border-radius: 8px; color: #fff; font-size: 14px; outline: none; }
        .auth-card input:focus { border-color: #3b82f6; }
        .auth-card button { width: 100%; padding: 12px; background: #3b82f6; border: none; border-radius: 8px; color: white; font-size: 16px; font-weight: bold; cursor: pointer; transition: background 0.2s; }
        .auth-card button:hover { background: #2563eb; }
        .toggle-auth { color: #60a5fa; font-size: 12px; margin-top: 15px; cursor: pointer; display: inline-block; }
        .toggle-auth:hover { text-decoration: underline; }
        .error-msg { color: #ef4444; font-size: 12px; margin-bottom: 10px; display: none; }
        .app-layout { display: none; height: 100vh; width: 100vw; flex-direction: row; }
        .sidebar { width: 360px; min-width: 320px; background: #0f172a; border-left: 1px solid #1e293b; display: flex; flex-direction: column; }
        .sidebar-header { padding: 20px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #1e293b; }
        .user-info { display: flex; align-items: center; gap: 12px; }
        .my-avatar-container { position: relative; width: 45px; height: 45px; }
        .my-avatar { width: 45px; height: 45px; border-radius: 50%; background: #3b82f6; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 18px; color: white; }
        .status-dot { position: absolute; bottom: 2px; right: 2px; width: 11px; height: 11px; background: #22c55e; border-radius: 50%; border: 2px solid #0f172a; }
        .chat-main { flex: 1; display: flex; flex-direction: column; background: #0b0f19; }
        .chat-header { padding: 15px 25px; background: #0f172a; border-bottom: 1px solid #1e293b; display: flex; align-items: center; justify-content: space-between; }
        .chat-messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        .message { max-width: 70%; padding: 10px 15px; border-radius: 12px; font-size: 14px; line-height: 1.5; }
        .message.incoming { background: #1e293b; align-self: flex-start; border-top-right-radius: 2px; }
        .message.outgoing { background: #3b82f6; color: white; align-self: flex-end; border-top-left-radius: 2px; }
        .chat-input-area { padding: 20px; background: #0f172a; border-top: 1px solid #1e293b; display: flex; gap: 10px; }
        .chat-input-area input { flex: 1; padding: 12px 15px; background: #1e293b; border: 1px solid #334155; border-radius: 8px; color: white; outline: none; }
        .chat-input-area button { padding: 0 20px; background: #3b82f6; border: none; border-radius: 8px; color: white; cursor: pointer; }
    </style>
</head>
<body>

    <!-- شاشة تسجيل الدخول -->
    <div id="authContainer" class="auth-container">
        <div class="auth-card">
            <i class="fa-solid fa-shield-halved"></i>
            <h1>NOVA</h1>
            <p>منصة التواصل المشفرة والآمنة</p>
            <div id="errorMsg" class="error-msg">الرجاء إدخال البريد الإلكتروني وكلمة المرور</div>
            <input type="email" id="emailInput" placeholder="البريد الإلكتروني" required>
            <input type="password" id="passwordInput" placeholder="كلمة المرور" required>
            <button id="loginBtn" type="button">دخول</button>
            <span class="toggle-auth" id="toggleAuthMode">ليس لديك حساب؟ أنشئ حساباً جديداً</span>
        </div>
    </div>

    <!-- واجهة التطبيق الرئيسية -->
    <div id="appLayout" class="app-layout">
        <div class="sidebar">
            <div class="sidebar-header">
                <div class="user-info">
                    <div class="my-avatar-container">
                        <div class="my-avatar" id="userAvatarLetter">S</div>
                        <div class="status-dot"></div>
                    </div>
                    <div>
                        <h4 id="userNameDisplay">Sinan</h4>
                        <span style="font-size: 11px; color: #22c55e;">● متصل الآن</span>
                    </div>
                </div>
                <button id="logoutBtn" style="background: transparent; border: none; color: #ef4444; cursor: pointer;" title="تسجيل الخروج">
                    <i class="fa-solid fa-power-off"></i>
                </button>
            </div>
        </div>
        <div class="chat-main">
            <div class="chat-header">
                <h3>المحادثة العامة المشفرة</h3>
                <span style="font-size: 12px; color: #94a3b8;">● اتصال مشفر E2EE</span>
            </div>
            <div class="chat-messages" id="chatMessages">
                <div class="message incoming">أهلاً بك في منصة NOVA! يمكنك البدء بالدردشة الآن.</div>
            </div>
            <div class="chat-input-area">
                <input type="text" id="messageInput" placeholder="اكتب رسالتك هنا...">
                <button id="sendBtn"><i class="fa-solid fa-paper-plane"></i></button>
            </div>
        </div>
    </div>

    <script>
        const authContainer = document.getElementById('authContainer');
        const appLayout = document.getElementById('appLayout');
        const loginBtn = document.getElementById('loginBtn');
        const logoutBtn = document.getElementById('logoutBtn');
        const emailInput = document.getElementById('emailInput');
        const passwordInput = document.getElementById('passwordInput');
        const errorMsg = document.getElementById('errorMsg');
        
        // ربط زر الدخول بشكل مباشر وصحيح لمنع أي تعطل
        loginBtn.addEventListener('click', function() {
            const email = emailInput.value.trim();
            const password = passwordInput.value.trim();

            if(email === "" || password === "") {
                errorMsg.style.display = 'block';
                return;
            }

            errorMsg.style.display = 'none';
            // الانتقال إلى واجهة التطبيق الرئيسية
            authContainer.style.display = 'none';
            appLayout.style.display = 'flex';
        });

        logoutBtn.addEventListener('click', function() {
            appLayout.style.display = 'none';
            authContainer.style.display = 'flex';
            emailInput.value = '';
            passwordInput.value = '';
        });
    </script>
</body>
</html>
