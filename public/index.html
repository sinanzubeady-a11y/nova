<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NOVA - المحادثة الشاملة</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
html, body { height: 100vh; width: 100vw; background-color: #0b0e14; color: #ffffff; overflow: hidden; }

.auth-container { display: flex; justify-content: center; align-items: center; height: 100vh; background: #0b0e14; position: absolute; top: 0; left: 0; width: 100%; z-index: 10; }
.auth-card { background: #0f172a; padding: 40px; border-radius: 20px; border: 1px solid #1e293b; width: 100%; max-width: 400px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
.auth-card i { font-size: 50px; color: #3b82f6; margin-bottom: 15px; }
.auth-card h1 { font-size: 28px; letter-spacing: 2px; margin-bottom: 5px; }
.auth-card p { color: #94a3b8; font-size: 13px; margin-bottom: 20px; }
.auth-card input { width: 100%; padding: 12px 15px; background: #1e293b; border: 1px solid #334155; border-radius: 10px; color: white; margin-bottom: 12px; outline: none; font-size: 14px; }
.auth-card button { width: 100%; padding: 12px; background: #2563eb; border: none; border-radius: 10px; color: white; font-weight: bold; font-size: 15px; cursor: pointer; transition: 0.3s; }
.auth-card button:hover { background: #1d4ed8; }
.toggle-auth { color: #60a5fa; font-size: 12px; margin-top: 15px; cursor: pointer; display: block; }
.error-msg { color: #ef4444; font-size: 12px; margin-bottom: 10px; display: none; }

.app-layout { display: none; height: 100vh; width: 100vw; flex-direction: row; }
.sidebar { width: 360px; min-width: 320px; background: #0f172a; border-left: 1px solid #1e293b; display: flex; flex-direction: column; height: 100vh; }

.dash-header { height: 75px; padding: 0 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1e293b; }
.my-profile-info { display: flex; align-items: center; gap: 10px; cursor: pointer; }
.my-avatar-container { position: relative; width: 45px; height: 45px; }
.my-avatar { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; background: #1e293b; display: flex; align-items: center; justify-content: center; font-weight: bold; border: 2px solid #2563eb; }
.avatar-upload-overlay { position: absolute; bottom: 0; right: 0; background: #2563eb; width: 18px; height: 18px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 10px; color: white; }

.conversations-section { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 8px; }
.chat-item { display: flex; align-items: center; justify-content: space-between; padding: 12px; border-radius: 12px; cursor: pointer; background: #1e293b; transition: 0.2s; }
.chat-item:hover, .chat-item.active { background: #2563eb; }
.chat-user-details { display: flex; align-items: center; gap: 12px; }
.chat-avatar { width: 42px; height: 42px; border-radius: 50%; background: #0b0e14; display: flex; align-items: center; justify-content: center; font-weight: bold; object-fit: cover; }

.unread-badge { background: #ef4444; color: white; font-size: 11px; font-weight: bold; padding: 2px 8px; border-radius: 12px; display: none; }
.unread-badge.active { display: inline-block; }

.chat-window { flex: 1; display: flex; flex-direction: column; height: 100vh; background: #0b0e14; }
.chat-header { height: 65px; padding: 0 20px; background: #0f172a; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #1e293b; }

.messages-area { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
.message-row { display: flex; gap: 10px; align-items: flex-end; }
.message-row.outgoing { flex-direction: row-reverse; }
.msg-avatar { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; background: #1e293b; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: bold; }

.message-bubble { max-width: 60%; padding: 12px 16px; border-radius: 16px; font-size: 14px; line-height: 1.4; word-break: break-word; }
.message-bubble.incoming { background: #1e293b; border-bottom-right-radius: 4px; color: #fff; }
.message-bubble.outgoing { background: #2563eb; border-bottom-left-radius: 4px; color: #fff; }
.message-time { font-size: 10px; color: #94a3b8; margin-top: 4px; text-align: left; }
.chat-img { max-width: 100%; border-radius: 8px; margin-top: 5px; }

.chat-input-area { height: 70px; padding: 0 20px; background: #0f172a; display: flex; gap: 10px; align-items: center; border-top: 1px solid #1e293b; }
.chat-input-area input[type="text"] { flex: 1; padding: 12px 20px; background: #1e293b; border: 1px solid #334155; border-radius: 25px; color: white; outline: none; font-size: 14px; }

.icon-btn { background: #1e293b; color: #94a3b8; border: 1px solid #334155; width: 42px; height: 42px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s; flex-shrink: 0; }
.icon-btn:hover { color: #3b82f6; border-color: #3b82f6; }
.icon-btn.recording { background: #ef4444; color: white; border-color: #ef4444; animation: pulse 1s infinite; }

@keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.08); } 100% { transform: scale(1); } }

.send-btn { background: #2563eb; border: none; width: 42px; height: 42px; border-radius: 50%; color: white; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 15px; flex-shrink: 0; }
.logout-btn { color: #ef4444; font-size: 13px; cursor: pointer; padding: 15px; text-align: center; border-top: 1px solid #1e293b; }
.typing-status { font-size: 11px; color: #60a5fa; margin-top: 2px; }
</style>
</head>
<body>

<div id="authScreen" class="auth-container">
<div class="auth-card">
<i class="fa-solid fa-shield-halved"></i>
<h1 id="authTitle">NOVA</h1>
<p id="authSubtitle">منصة التواصل المشفرة والآمنة</p>
<div id="errorMsg" class="error-msg"></div>
<input type="text" id="authUsername" placeholder="اسم المستخدم">
<input type="password" id="authPassword" placeholder="كلمة المرور">
<button id="authBtn" onclick="handleAuth()">دخول</button>
<span class="toggle-auth" id="toggleAuthBtn" onclick="toggleAuthMode()">ليس لديك حساب؟ أنشئ حساباً جديداً</span>
</div>
</div>

<div id="appLayout" class="app-layout">
<div class="sidebar">
<div class="dash-header">
<div class="my-profile-info" onclick="document.getElementById('avatarInput').click()">
<div class="my-avatar-container">
<img id="myAvatarImg" class="my-avatar" src="" style="display:none;">
<div id="myAvatarText" class="my-avatar"></div>
<div class="avatar-upload-overlay"><i class="fa-solid fa-camera"></i></div>
</div>
<input type="file" id="avatarInput" style="display:none;" accept="image/*" onchange="changeAvatar(this)">
<div>
<div style="font-weight: bold; font-size: 15px;" id="myUserDisplay"></div>
<div style="font-size: 11px; color: #22c55e;">متصل الآن</div>
</div>
</div>
<h2 style="color:#3b82f6;">NOVA</h2>
</div>
<div class="conversations-section" id="usersList"></div>
<span class="logout-btn" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i> تسجيل الخروج</span>
</div>

<div class="chat-window">
<div class="chat-header">
<div>
<h4 style="margin: 0;" id="chatTitle">المحادثة العامة المشفرة</h4>
<div class="typing-status" id="typingStatus">● اتصال مشفر E2EE</div>
</div>
</div>

<div class="messages-area" id="messagesArea"></div>

<div class="chat-input-area">
<label for="fileInput" class="icon-btn"><i class="fa-solid fa-paperclip"></i></label>
<input type="file" id="fileInput" style="display: none;" onchange="uploadFile(this)">

<button class="icon-btn" id="recordBtn" onclick="toggleRecord()"><i class="fa-solid fa-microphone"></i></button>

<input type="text" id="msgInput" placeholder="اكتب رسالتك..." onkeypress="handleKeyPress(event)" oninput="handleTyping()">
<button class="send-btn" onclick="sendMessage()"><i class="fa-solid fa-paper-plane"></i></button>
</div>
</div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();
let isRegisterMode = false;
let currentUser = localStorage.getItem('nova_user') || "";
let currentAvatar = localStorage.getItem('nova_avatar') || "";
let token = localStorage.getItem('nova_token') || "";
let currentTarget = "global";
let typingTimer;
let mediaRecorder;
let audioChunks = [];
let isRecording = false;
const unreadCounts = {};

function playNotificationSound() {
try {
const ctx = new (window.AudioContext || window.webkitAudioContext)();
const osc = ctx.createOscillator();
const gain = ctx.createGain();
osc.type = 'sine';
osc.frequency.setValueAtTime(587.33, ctx.currentTime);
osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.15);
gain.gain.setValueAtTime(0.1, ctx.currentTime);
gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.15);
osc.connect(gain);
gain.connect(ctx.destination);
osc.start();
osc.stop(ctx.currentTime + 0.15);
} catch(e) {}
}

window.onload = () => {
if (token && currentUser) startChat();
};

function toggleAuthMode() {
isRegisterMode = !isRegisterMode;
document.getElementById('authTitle').innerText = isRegisterMode ? 'حساب جديد' : 'NOVA';
document.getElementById('authBtn').innerText = isRegisterMode ? 'إنشاء الحساب' : 'دخول';
document.getElementById('toggleAuthBtn').innerText = isRegisterMode ? 'لديك حساب بالفعل؟ سجل الدخول' : 'ليس لديك حساب؟ أنشئ حساباً جديداً';
}

async function handleAuth() {
const username = document.getElementById('authUsername').value.trim();
const password = document.getElementById('authPassword').value.trim();
const errorMsg = document.getElementById('errorMsg');

if (!username || !password) return;

const endpoint = isRegisterMode ? '/api/register' : '/api/login';
try {
const res = await fetch(endpoint, {
method: 'POST',
headers: { 'Content-Type': 'application/json' },
body: JSON.stringify({ username, password })
});
const data = await res.json();
if (!res.ok) {
errorMsg.innerText = data.error;
errorMsg.style.display = "block";
} else {
localStorage.setItem('nova_token', data.token);
localStorage.setItem('nova_user', data.username);
localStorage.setItem('nova_avatar', data.avatar || '');
currentUser = data.username;
currentAvatar = data.avatar || '';
startChat();
}
} catch (err) {
errorMsg.innerText = "تعذر الاتصال بالسيرفر";
errorMsg.style.display = "block";
}
}

function startChat() {
document.getElementById('authScreen').style.display = 'none';
document.getElementById('appLayout').style.display = 'flex';
document.getElementById('myUserDisplay').innerText = currentUser;
updateMyAvatarUI();
loadUsers();
switchChat('global', 'المحادثة العامة المشفرة');
}

function updateMyAvatarUI() {
const avatarImg = document.getElementById('myAvatarImg');
const avatarText = document.getElementById('myAvatarText');
if (currentAvatar) {
avatarImg.src = currentAvatar;
avatarImg.style.display = 'block';
avatarText.style.display = 'none';
} else {
avatarImg.style.display = 'none';
avatarText.style.display = 'flex';
avatarText.innerText = currentUser.charAt(0).toUpperCase();
}
}

async function changeAvatar(input) {
if (!input.files || !input.files[0]) return;
const formData = new FormData();
formData.append('avatar', input.files[0]);
formData.append('username', currentUser);

try {
const res = await fetch('/api/upload-avatar', { method: 'POST', body: formData });
const data = await res.json();
if (data.avatarUrl) {
currentAvatar = data.avatarUrl;
localStorage.setItem('nova_avatar', currentAvatar);
updateMyAvatarUI();
loadUsers();
}
} catch (err) {}
}

async function loadUsers() {
try {
const res = await fetch('/api/users');
const users = await res.json();
const usersList = document.getElementById('usersList');

let html = `
<div class="chat-item ${currentTarget === 'global' ? 'active' : ''}" onclick="switchChat('global', 'المحادثة العامة المشفرة')">
<div class="chat-user-details">
<div class="chat-avatar" style="background:#2563eb; color:white;"><i class="fa-solid fa-users"></i></div>
<div><div style="font-weight: 600;">المحادثة العامة</div></div>
</div>
</div>
`;

users.forEach(u => {
if (u.username !== currentUser) {
const count = unreadCounts[u.username] || 0;
const avatarHTML = u.avatar ? `<img src="${u.avatar}" class="chat-avatar" />` : `<div class="chat-avatar" style="background:#1e293b;">${u.username.charAt(0).toUpperCase()}</div>`;

html += `
<div class="chat-item ${currentTarget === u.username ? 'active' : ''}" onclick="switchChat('${u.username}', 'محادثة خاصة مع ${u.username}')">
<div class="chat-user-details">
${avatarHTML}
<div><div style="font-weight: 600;">${u.username}</div></div>
</div>
<span class="unread-badge ${count > 0 ? 'active' : ''}">${count}</span>
</div>
`;
}
});
usersList.innerHTML = html;
} catch (err) {}
}

function switchChat(target, title) {
currentTarget = target;
unreadCounts[target] = 0;
document.getElementById('chatTitle').innerText = title;
socket.emit('load chat history', { currentUser, target: currentTarget });
loadUsers();
}

function logout() {
localStorage.clear();
location.reload();
}

function handleKeyPress(e) { if (e.key === 'Enter') sendMessage(); }

function handleTyping() {
socket.emit('typing', { user: currentUser, receiver: currentTarget });
clearTimeout(typingTimer);
typingTimer = setTimeout(() => socket.emit('stop typing'), 2000);
}

function sendMessage(fileUrl = '', type = 'text') {
const input = document.getElementById('msgInput');
const text = input.value.trim();

if (text !== "" || fileUrl !== "") {
const data = {
user: currentUser,
receiver: currentTarget,
text: text,
fileUrl: fileUrl,
type: type,
time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
};
socket.emit('chat message', data);
socket.emit('stop typing');
input.value = '';
}
}

async function uploadFile(input) {
if (!input.files || !input.files[0]) return;
const formData = new FormData();
formData.append('file', input.files[0]);

try {
const res = await fetch('/api/upload', { method: 'POST', body: formData });
const data = await res.json();
if (data.fileUrl) sendMessage(data.fileUrl, 'image');
} catch (err) {}
input.value = '';
}

async function toggleRecord() {
const recordBtn = document.getElementById('recordBtn');
if (!isRecording) {
try {
const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
mediaRecorder = new MediaRecorder(stream);
audioChunks = [];
mediaRecorder.ondataavailable = (e) => audioChunks.push(e.data);
mediaRecorder.onstop = async () => {
const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
const formData = new FormData();
formData.append('file', audioBlob, 'voice.webm');

const res = await fetch('/api/upload', { method: 'POST', body: formData });
const data = await res.json();
if (data.fileUrl) sendMessage(data.fileUrl, 'audio');
};
mediaRecorder.start();
isRecording = true;
recordBtn.classList.add('recording');
} catch (err) {}
} else {
mediaRecorder.stop();
isRecording = false;
recordBtn.classList.remove('recording');
}
}

socket.on('chat message', (data) => {
const isCurrentChat = (currentTarget === 'global' && data.receiver === 'global') ||
(data.receiver === currentUser && data.user === currentTarget) ||
(data.user === currentUser && data.receiver === currentTarget);

if (isCurrentChat) {
appendMessage(data);
} else if (data.receiver === currentUser) {
unreadCounts[data.user] = (unreadCounts[data.user] || 0) + 1;
loadUsers();
}

if (data.user !== currentUser) {
playNotificationSound();
}
});

socket.on('load old messages', (messages) => {
const messagesArea = document.getElementById('messagesArea');
messagesArea.innerHTML = '';
messages.forEach((data) => appendMessage(data));
});

socket.on('user typing', (data) => {
if (data.receiver === currentTarget || (currentTarget === 'global' && data.receiver === 'global')) {
document.getElementById('typingStatus').innerText = `✍️ ${data.user} يكتب الآن...`;
}
});

socket.on('user stop typing', () => {
document.getElementById('typingStatus').innerText = '● اتصال مشفر E2EE';
});

function appendMessage(data) {
const messagesArea = document.getElementById('messagesArea');
const rowDiv = document.createElement('div');
const isMe = data.user === currentUser;
rowDiv.className = `message-row ${isMe ? 'outgoing' : 'incoming'}`;

const avatarHTML = data.avatar
? `<img src="${data.avatar}" class="msg-avatar" />`
: `<div class="msg-avatar">${data.user.charAt(0).toUpperCase()}</div>`;

let content = `<div class="message-bubble ${isMe ? 'outgoing' : 'incoming'}">`;
if (!isMe) content += `<strong style="font-size: 11px; display:block; color: #60a5fa; margin-bottom: 2px;">${data.user}</strong>`;

if (data.type === 'audio') {
content += `<audio controls style="width: 220px; height: 35px; margin-top: 5px;"><source src="${data.fileUrl}" type="audio/webm"></audio>`;
} else if (data.type === 'image' || data.fileUrl) {
content += `<img src="${data.fileUrl}" class="chat-img" alt="صورة مرفقة" />`;
}

if (data.text) content += `<div>${data.text}</div>`;
content += `<div class="message-time">${data.time} ${isMe ? '✓✓' : ''}</div></div>`;

rowDiv.innerHTML = avatarHTML + content;
messagesArea.appendChild(rowDiv);
messagesArea.scrollTop = messagesArea.scrollHeight;
}
</script>
</body>
</html>
